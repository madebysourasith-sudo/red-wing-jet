<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Path Stepper</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* FLIGHT PATH STEPPER: a booking progress stepper drawn as a flight route on a printed relief chart. The jet sits at the
   current step; Continue / Back (or a click on a visited marker, or stepper.go(i)) flies it along the great-circle arc,
   laying a contrail behind it and stamping each marker it leaves with a check. Map, relief and labels are procedural. */
:root{--sans:"Switzer","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --ink:#1e1618;--accent:#c8102e;--ink2:#5d574f;--muted:#8d867c;--paper:#f3f0ea;--line:rgba(38,35,31,.12);--foot:68px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.06;mix-blend-mode:overlay;pointer-events:none;z-index:50}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#stepper{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) var(--foot)}
#map{position:relative;overflow:hidden;background:var(--paper)}
#map canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cv-map{opacity:0;transition:opacity .9s ease}
#map.ready #cv-map{opacity:1}
#cv-air,#cv-jet{pointer-events:none}
.cap{position:absolute;left:24px;bottom:14px;margin:0;font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);opacity:.8;pointer-events:none}

/* step markers: printed on the chart, under the jet */
#markers{position:absolute;inset:0;margin:0;padding:0;list-style:none;pointer-events:none}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.mkb{position:absolute;left:-20px;top:-20px;width:40px;height:40px;margin:0;padding:0;border:0;background:none;border-radius:50%;
  color:var(--ink);font:inherit;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.mkb:focus{outline:none}
.mkb[aria-disabled="true"]{cursor:default}
.ring{position:absolute;left:13px;top:13px;width:14px;height:14px;border-radius:50%;border:1.1px solid currentColor;background:var(--paper);
  box-shadow:0 0 0 2px rgba(243,240,234,.75);transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .3s,border-width .2s}
.ring svg{position:absolute;inset:-1.1px;width:14px;height:14px;overflow:visible}
.ring path{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10;stroke-dashoffset:10;transition:stroke-dashoffset .38s cubic-bezier(.5,0,.2,1) .06s}
.mk.done .ring path{stroke-dashoffset:0}
.mk.done .ring{border-width:1.25px;color:var(--accent)}
.mk.stamp .ring{animation:stamp .5s cubic-bezier(.2,.9,.3,1)}
@keyframes stamp{0%{transform:scale(1.75) rotate(-14deg);opacity:.2}45%{transform:scale(.9) rotate(2deg);opacity:1}100%{transform:none}}
.mk.future .ring{color:#8f887e}
.mk.future .lab{color:#8a8379}
.mk.cur .ring{color:var(--accent);background:var(--accent);box-shadow:0 0 0 2px rgba(243,240,234,.75),inset 0 0 0 3px var(--paper)}
.lab{position:absolute;left:20px;top:20px;white-space:nowrap;transform-origin:0 0;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  padding:4px 5px;text-shadow:0 0 2px var(--paper),0 0 4px var(--paper),0 0 8px rgba(243,240,234,.9);will-change:transform;transition:color .25s}
.lab b{font-weight:500;color:#776f65;margin-right:.55em}
.mkb:not([aria-disabled="true"]):hover .ring{transform:scale(1.22)}
.mkb:focus-visible .ring{box-shadow:0 0 0 3px var(--paper),0 0 0 4.2px var(--ink)}
.mkb:focus-visible .lab{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.city{text-shadow:0 0 2px var(--paper),0 0 5px var(--paper);position:absolute;left:0;top:0;white-space:nowrap;font:500 10px/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);pointer-events:none}
.city span{display:block;color:var(--muted);font-size:9px;letter-spacing:.18em}

/* title cartouche, printed like a chart's title block */
.cart{position:absolute;left:24px;top:22px;margin:0;padding:13px 17px 12px;background:rgba(244,241,235,.9);border:1px solid rgba(38,35,31,.55);color:var(--ink);pointer-events:none}
.cart::before{content:"";position:absolute;inset:3px;border:.5px solid rgba(38,35,31,.3);pointer-events:none}
.cart p{margin:0;white-space:nowrap}
.cart .k{font:500 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cart .r{display:flex;align-items:center;gap:12px;margin-top:9px;font:300 27px/1 var(--sans);letter-spacing:.04em}
.cart .ln{position:relative;width:34px;height:1px;background:currentColor;opacity:.7}
.cart .ln::after{content:"";position:absolute;right:-1px;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.cart .n{margin-top:7px;font:400 12px/1.2 var(--sans);letter-spacing:.02em;color:var(--ink2)}
.cart .f{margin-top:9px;padding-top:8px;border-top:.5px solid rgba(38,35,31,.25);font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
@media (max-width:640px){
  .cart{left:14px;top:14px;padding:9px 12px 9px}
  .cart .k{font-size:8px}
  .cart .r{font-size:20px;margin-top:7px;gap:9px}
  .cart .ln{width:24px}
  .cart .n{font-size:11px;margin-top:5px}
  .cart .f{font-size:8.5px;margin-top:7px;padding-top:6px;letter-spacing:.1em}
}
@media (min-width:1700px){.cart{left:32px;top:28px;padding:15px 20px 14px}.cart .r{font-size:31px}.cart .n{font-size:13px}.cart .f{font-size:10px}}
/* quiet controls under the map */
.bar{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-top:1px solid var(--line);background:#f1eee7}
.txt{appearance:none;border:0;background:none;margin:0;padding:0 34px;font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:.8em;transition:color .2s,background .3s}
#back{border-right:1px solid var(--line)}
#next{border-left:1px solid var(--line)}
.txt .u{position:relative}
.txt .u::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.5,0,.2,1)}
.txt:hover .u::after,.txt:focus-visible .u::after{transform:none}
.txt:hover{background:rgba(38,35,31,.025)}
.txt:focus{outline:none}
.txt:focus-visible{box-shadow:inset 0 0 0 1px var(--ink)}
.txt:disabled{color:#b3ada4;cursor:default;background:none}
.txt:disabled .u::after{display:none}
.txt .ar{display:inline-block;transition:transform .35s cubic-bezier(.5,0,.2,1)}
#next:not(:disabled):hover .ar{transform:translateX(3px)}
#back:not(:disabled):hover .ar{transform:translateX(-3px)}
.status{margin:0;display:flex;align-items:center;justify-content:center;gap:1.1em;font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.status .pg{display:flex;gap:5px}
.status .pg i{width:14px;height:1px;background:#c9c3b9;transition:background .4s}
.status .pg i.on{background:var(--ink)}
@media (max-width:640px){
  :root{--foot:60px}
  .txt{padding:0 18px;font-size:11px;letter-spacing:.14em}
  .status{gap:.7em;font-size:9.5px}
  .status .pg{display:none}
  .lab{font-size:10px}
  .cap{left:16px;bottom:12px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .ring,.ring path,.lab,.txt .ar,.txt .u::after{transition:none}
  .mk.stamp .ring{animation:none}
  #cv-map{transition:none}
}
html.embed #stepper{grid-template-rows:minmax(0,1fr) 0}
html.embed .bar,html.embed .cap{display:none}
.zoomer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.zoomer canvas{position:absolute;left:0;top:0}
html.embed .cart{top:calc(80px + 18px)}
@media (max-width:700px){html.embed .cart{top:calc(76px + 12px)}}
html.embed #grain{opacity:.04}
</style>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="stepper">
  <div id="map">
    <canvas id="cv-map" role="img"></canvas>
    <canvas id="cv-air" aria-hidden="true"></canvas>
    <nav id="nav"><ol id="markers"></ol></nav>
    <div id="cities" aria-hidden="true"></div>
    <div class="cart" id="cart"><p class="k"></p><p class="r"><span class="o"></span><i class="ln" aria-hidden="true"></i><span class="d"></span></p><p class="n"></p><p class="f"></p></div>
    <canvas id="cv-jet" aria-hidden="true"></canvas>
    <p class="cap">Flight Path · Stepper</p>
  </div>
  <div class="bar">
    <button id="back" class="txt" type="button"><span class="ar" aria-hidden="true">&larr;</span><span class="u"></span></button>
    <p class="status" id="status" aria-live="polite"></p>
    <button id="next" class="txt" type="button"><span class="u"></span><span class="ar" aria-hidden="true">&rarr;</span></button>
  </div>
</div>
<svg id="grain" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
<script>
/* =====================================================================================================================
   FLIGHT PATH STEPPER
   CONFIG (below) holds every word on the page:
   - origin / destination: { name, code } printed at the ends of the arc (and used for the map's accessible name).
   - steps: one label per step, in order. Markers are spread evenly along the arc; the first sits on the origin,
     the last on the destination. 2 to 8 steps read well.
   - current: index (0-based) of the step the jet starts on. Steps before it are drawn completed (contrail + check).
   - labels: button / status copy. {n} {total} {step} are replaced in `status`.
   - chart.kicker / flight { date, time, number, duration }: the title cartouche, top left.
   - seed: changes the hand of the procedural chart (relief noise, rivers). The geography layout itself is fixed.
   API (window.stepper):
     stepper.go(i)   fly to step i (any index; the flight passes, stamps or un-stamps the markers in between)
     stepper.next()  / stepper.back()
     stepper.index   current step index (read-only)
     stepper.el      the root element (#stepper)
   Events, dispatched on #stepper (bubbling):
     "stepchange"  detail { index, previous, step }   fired as soon as the step changes (the flight follows)
     "arrive"      detail { index, step }             fired when the jet lands on the marker
     "complete"    detail { index }                   fired when Continue is pressed on the last step
   Markers are buttons in an ordered list inside <nav>; the current one has aria-current="step". Visited markers are
   clickable (a completed one flies back); later, unvisited markers are aria-disabled. Arrow keys / Home / End move
   between markers, Enter / Space activates. prefers-reduced-motion: the jet jumps instead of flying.
   ===================================================================================================================== */
const CONFIG = {
  origin: { name: 'Montréal', code: 'YUL' },
  destination: { name: 'Nice', code: 'NCE' },
  steps: ['Call', 'Quote', 'Board', 'Arrive'],
  current: 0,
  labels: {
    back: 'Back', next: 'Continue', finish: 'Confirm', nav: 'Booking progress',
    status: 'Step {n} / {total} · {step}', completed: 'completed', map: 'Route map, {origin} to {destination}'
  },
  // the chart cartouche (top left). Any field can be '' to drop it.
  chart: { kicker: 'Red Wing · Flight plan' },
  flight: { date: '', time: 'Any day', number: 'RW 001', duration: '7 h 40' },
  seed: 11
};

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = $('#stepper'), mapEl = $('#map'), cvMap = $('#cv-map'), cvAir = $('#cv-air'), cvJet = $('#cv-jet');
const listEl = $('#markers'), citiesEl = $('#cities'), statusEl = $('#status'), btnBack = $('#back'), btnNext = $('#next');
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = mq.matches; mq.addEventListener?.('change', e => { reduce = e.matches; });
const N = Math.max(2, CONFIG.steps.length);
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------------------------------------------------------- noise */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry((CONFIG.seed | 0) || 11);
const PERM = new Uint8Array(512), GX = new Float32Array(256), GY = new Float32Array(256);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; GX[i] = Math.cos(a); GY[i] = Math.sin(a); } }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
  const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const n00 = GX[aa] * xf + GY[aa] * yf, n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
  const n01 = GX[ab] * xf + GY[ab] * (yf - 1), n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
  const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
  return (a + (b - a) * v) * 1.41;
}
function fbm(x, y, o) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f); n += a; a *= .5; f *= 2.03; } return s / n; }
function ridged(x, y, o) { let s = 0, a = .5, f = 1, w = 1, n = 0;
  for (let i = 0; i < o; i++) { let r = 1 - Math.abs(noise(x * f + i * 17.3, y * f)); r *= r; r *= w; w = clamp(r * 1.7, 0, 1); s += r * a; n += a; a *= .5; f *= 2.07; }
  return s / n; }

/* ---------------------------------------------------------------- geography (world units: origin (0,0), destination (1,.78)) */
const O = [0, 0], D = [1, .78];
const ARC_C = (() => { const mx = .5, my = .39, dx = D[0], dy = D[1], l = Math.hypot(dx, dy); return [mx + dy / l * .16 * l, my - dx / l * .16 * l]; })();
const NRM = [.41, .912];
function coastRaw(x, y) {
  const wx = x + .085 * fbm(x * 1.5 + 11.2, y * 1.5 + 3.1, 3), wy = y + .085 * fbm(x * 1.5 + 7.7, y * 1.5 + 19.4, 3);
  let c = (wx - D[0]) * NRM[0] + (wy - D[1]) * NRM[1];
  c += .04 * fbm(wx * 4.2 + 2, wy * 4.2 + 9, 4) + .009 * fbm(x * 16 + 40, y * 16, 2);
  c -= .055 * Math.exp(-((x - 1.3) ** 2 + (y - .66) ** 2) / .0035);      // headland east
  c -= .03 * Math.exp(-((x - 1.13) ** 2 + (y - .79) ** 2) / .0012);       // small cape
  c -= .05 * Math.exp(-((x - .55) ** 2 + (y - 1.02) ** 2) / .008);        // peninsula west
  c += .018 * Math.exp(-((x - .93) ** 2 + (y - .84) ** 2) / .004);        // the bay
  return c;
}
const C0 = coastRaw(D[0], D[1]) + .011;
const coast = (x, y) => coastRaw(x, y) - C0;
// the long crescent lake at the origin, plus three small valley lakes
const LAKE = (() => { const P0 = [.006, -.004], P1 = [.2, -.205], P2 = [.45, -.085], pts = [];
  for (let i = 0; i <= 30; i++) { const t = i / 30, a = (1 - t) ** 2, b = 2 * t * (1 - t), c = t * t;
    pts.push([a * P0[0] + b * P1[0] + c * P2[0], a * P0[1] + b * P1[1] + c * P2[1], .005 + .043 * sstep(.04, .6, t) * (1 - .45 * sstep(.86, 1, t))]); }
  return pts; })();
const SMALL_LAKES = [[.17, .27, .016, .055, .25], [-.21, .33, .014, .04, -.3], [.66, .63, .01, .022, .9], [1.22, .26, .008, .03, .4], [.36, .74, .006, .014, 1.2]];
function lake(x, y) {
  let best = -1;
  if (x > -.06 && x < .52 && y > -.28 && y < .06) {
    let dm = 1e9, wm = 0;
    for (let i = 0; i < LAKE.length - 1; i++) { const a = LAKE[i], b = LAKE[i + 1], vx = b[0] - a[0], vy = b[1] - a[1];
      const t = clamp(((x - a[0]) * vx + (y - a[1]) * vy) / (vx * vx + vy * vy), 0, 1), px = a[0] + vx * t - x, py = a[1] + vy * t - y, d = px * px + py * py;
      if (d < dm) { dm = d; wm = a[2] + (b[2] - a[2]) * t; } }
    best = wm - Math.sqrt(dm) + .003 * noise(x * 60, y * 60);
  }
  for (const [cx, cy, a, b, r] of SMALL_LAKES) { const dx = x - cx, dy = y - cy, hb = Math.max(a, b) * (1 + .03 / Math.min(a, b)); if (Math.abs(dx) > hb || Math.abs(dy) > hb) continue;
    const cs = Math.cos(r), sn = Math.sin(r), u = (dx * cs + dy * sn) / a, v = (-dx * sn + dy * cs) / b;
    const q = (1 - Math.sqrt(u * u + v * v)) * a + .002 * noise(x * 90, y * 90); if (q > best) best = q; }
  return best;
}
const BELT = [[.4, -.7], [.55, -.12], [.7, .3], [.95, .5], [1.4, .42], [1.8, .3]];
function distPoly(P, x, y) { let dm = 1e9;
  for (let i = 0; i < P.length - 1; i++) { const a = P[i], b = P[i + 1], vx = b[0] - a[0], vy = b[1] - a[1];
    const t = clamp(((x - a[0]) * vx + (y - a[1]) * vy) / (vx * vx + vy * vy), 0, 1), px = a[0] + vx * t - x, py = a[1] + vy * t - y;
    dm = Math.min(dm, px * px + py * py); } return Math.sqrt(dm); }
function height(x, y, c, l) {
  const d = distPoly(BELT, x + .06 * noise(x * 2 + 5, y * 2), y);
  const belt = Math.exp(-(d * d) / .06);
  const r = ridged(x * 4.4 + 3.3, y * 4.4 + 1.7, 5);
  let h = belt * (.18 + .95 * r) + .2 * (fbm(x * 2.4 + 20, y * 2.4, 4) + .45) * (.6 + .4 * belt) + .07 * ridged(x * 9 + 2, y * 9, 3) * (.3 + belt);
  h *= sstep(0, .17, -c);
  if (l > -.045) h *= .62 + .38 * sstep(0, .045, -l);
  return h;
}

/* ---------------------------------------------------------------- layout */
// on tall screens the chart turns track-up (rotated) so the route runs down the screen
const view = { W: 0, H: 0, S: 1, ox: 0, oy: 0, dpr: 1, jl: 70, rot: 0, cr: 1, sr: 0 };
const W2S = (x, y) => [view.ox + (x * view.cr - y * view.sr) * view.S, view.oy + (x * view.sr + y * view.cr) * view.S];
const S2W = (sx, sy) => { const dx = (sx - view.ox) / view.S, dy = (sy - view.oy) / view.S; return [dx * view.cr + dy * view.sr, -dx * view.sr + dy * view.cr]; };
const arcBox = () => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (let i = 0; i <= 64; i++) { const q = bez(i / 64), p = [q[0] * view.cr - q[1] * view.sr, q[0] * view.sr + q[1] * view.cr]; x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); } return { x0, x1, y0, y1 }; };
function bez(t) { const a = (1 - t) ** 2, b = 2 * t * (1 - t), c = t * t; return [a * O[0] + b * ARC_C[0] + c * D[0], a * O[1] + b * ARC_C[1] + c * D[1]]; }
// what must breathe inside the frame: the whole arc and the lake at the origin
const FIT_PTS = (() => { const P = []; for (let i = 0; i <= 40; i++) P.push(bez(i / 40)); for (const l of LAKE) P.push([l[0], l[1] - l[2] - .012], [l[0], l[1] + l[2] + .006]); return P; })();
const cartEl = $('#cart');
let cartRect = null;
function layout() {
  const r = mapEl.getBoundingClientRect(); view.W = Math.round(r.width); view.H = Math.round(r.height);
  view.dpr = document.documentElement.classList.contains('embed') ? Math.min((window.devicePixelRatio || 1) * (view.W < 700 ? 1.25 : 2), 3) : Math.min(window.devicePixelRatio || 1, 2);
  const W = view.W, H = view.H, tall = H > W * 1.25;

/* ---------------------------------------------------------------- markers (DOM) */
const marks = [];
function buildMarkers() {

  listEl.innerHTML = ''; marks.length = 0;
  for (let i = 0; i < N; i++) {
    const li = document.createElement('li'); li.className = 'mk';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mkb';
    b.innerHTML = `<span class="ring" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M4 7.3l2 1.9 4.1-4.4"/></svg></span><span class="lab"><b>${pad2(i + 1)}</b>${CONFIG.steps[i] ?? ''}</span><span class="sr st"></span>`;

}
function setRoving(j) { marks.forEach((m, i) => m.b.tabIndex = i === j ? 0 : -1); }
function syncMarkers() {
  marks.forEach((m, i) => {

    m.b.toggleAttribute('aria-current', cur); if (cur) m.b.setAttribute('aria-current', 'step');
    m.b.setAttribute('aria-disabled', reach && !cur ? 'false' : 'true');

  });
  setRoving(index);
  const t = CONFIG.labels;
  statusEl.innerHTML = `<span>${t.status.replace('{n}', pad2(index + 1)).replace('{total}', pad2(N)).replace('{step}', CONFIG.steps[index] ?? '')}</span><span class="pg" aria-hidden="true">${CONFIG.steps.map((_, i) => `<i class="${i <= index ? 'on' : ''}"></i>`).join('')}</span>`;
  btnBack.disabled = index === 0;

}
function measureLabels() { for (const m of marks) { m.lw = m.lab.offsetWidth; m.lh = m.lab.offsetHeight; if (m.city) { m.cw = m.city.offsetWidth; m.ch = m.city.offsetHeight; } } }
function fillCart() {
  const f = CONFIG.flight || {}, c = CONFIG.chart || {};
  cartEl.querySelector('.k').textContent = c.kicker || ''; cartEl.querySelector('.k').hidden = !c.kicker;
  cartEl.querySelector('.o').textContent = CONFIG.origin.code; cartEl.querySelector('.d').textContent = CONFIG.destination.code;
  cartEl.querySelector('.n').textContent = `${CONFIG.origin.name} — ${CONFIG.destination.name}`;
  const line = [f.date, f.time, f.number, f.duration].filter(Boolean).join(' · ');
  cartEl.querySelector('.f').textContent = line; cartEl.querySelector('.f').hidden = !line;
  cartEl.setAttribute('aria-label', `${CONFIG.origin.name} to ${CONFIG.destination.name}${line ? ', ' + line : ''}`);
}
const DIRS = [...Array(8)].map((_, k) => [Math.cos(k * Math.PI / 4), Math.sin(k * Math.PI / 4)]);
let labelsSnap = true;
const FOOTBUF = [];
function placeMarkers(jet, dt) {
  const { W, H, jl } = view;
  const foot = footprint(jet.x, jet.y, jet.ang, jet.alt, FOOTBUF);
  const pts = marks.map((m, i) => at(uOf(i) * arc.L));
  const route = []; for (let s = 0; s <= arc.L; s += 9) { const p = at(s); route.push(p.x, p.y); }
  const placed = [];
  const score = (x, y, w, h, own) => {

    if (cartRect && x < cartRect[2] + 8 && x + w > cartRect[0] - 8 && y < cartRect[3] + 8 && y + h > cartRect[1] - 8) sc += 2000;
    const x0 = x - 7, y0 = y - 7, x1 = x + w + 7, y1 = y + h + 7;
    for (let i = 0; i < foot.length; i += 2) { const px = foot[i], py = foot[i + 1]; if (px > x0 && px < x1 && py > y0 && py < y1) sc += 90; }
    for (const q of placed) if (x < q[2] + 5 && x + w > q[0] - 5 && y < q[3] + 5 && y + h > q[1] - 5) sc += 1200;
    pts.forEach((p, i) => { if (i !== own && p.x > x - 10 && p.x < x + w + 10 && p.y > y - 10 && p.y < y + h + 10) sc += 600; });
    for (let i = 0; i < route.length; i += 2) if (route[i] > x - 3 && route[i] < x + w + 3 && route[i + 1] > y - 3 && route[i + 1] < y + h + 3) sc += 30;
    return sc; };
  const choose = (L, p, w, h, pref, own) => {

      const kx = Math.abs(d[0]) < .3 ? 0 : Math.sign(d[0]), ky = Math.abs(d[1]) < .3 ? 0 : Math.sign(d[1]);
      const x = p.x + d[0] * dist - w * (.5 - .5 * kx), y = p.y + d[1] * dist - h * (.5 - .5 * ky);

    else { const e = 1 - Math.exp(-dt * 11); L.cur[0] += (best[0] - L.cur[0]) * e; L.cur[1] += (best[1] - L.cur[1]) * e; }

    const nl = Math.hypot(nx, ny), c = choose(m.L || (m.L = {}), p, m.lw, m.lh, [nx / nl, ny / nl], i);

}

/* ---------------------------------------------------------------- API */
function go(i) {

  const previous = index; index = i; maxReached = Math.max(maxReached, i);
  const target = uOf(i), now = performance.now();
  st.from = st.s; st.to = target; st.t0 = now; st.dir = target > st.s ? 1 : -1;
  st.dur = reduce ? 0 : clamp(750 + 1500 * Math.sqrt(Math.abs(target - st.s)), 700, 3000);
  st.flying = true; st.airDirty = true;

const next = () => { if (index === N - 1) root.dispatchEvent(new CustomEvent('complete', { bubbles: true, detail: { index } })); else go(index + 1); };
const back = () => go(index - 1);
btnNext.addEventListener('click', next); btnBack.addEventListener('click', back);
// embed API: scrub(s) puts the jet at s (0 origin .. 1 destination) along the route, the page scroll driving it;
// zoom(k, x, y) scales the chart k times around chart point (x, y), kept inside the frame
function scrub(s) {
  s = clamp(s, 0, 1); const i = Math.min(N - 1, Math.floor(s * (N - 1) + 1e-4));
  st.dir = s >= st.s ? 1 : -1; st.s = st.from = st.to = s; st.flying = false; st.airDirty = true;
  if (i !== index || maxReached !== i) { index = i; maxReached = i; syncMarkers(); }
  return at(s * arc.L);
}
let zoomer = null;
function zoom(k, fx, fy) {
  if (!zoomer) { zoomer = document.createElement('div'); zoomer.className = 'zoomer'; mapEl.insertBefore(zoomer, mapEl.firstChild);
    for (const el of [cvMap, cvAir, $('#nav'), citiesEl, cvJet]) zoomer.appendChild(el); }
  const W = view.W, H = view.H; let tx = W / 2 - fx * k, ty = H / 2 - fy * k;
  tx = clamp(tx, W - W * k, 0); ty = clamp(ty, H - H * k, 0);
  zoomer.style.transform = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${k.toFixed(4)})`;
}
window.stepper = { go, next, back, scrub, zoom, get index() { return index; }, el: root };
// embedded in the landing: the page posts its scroll progress (0..1); the flight takes the first 80 %, the zoom onto the
// destination the rest, and the current step goes back to the page (works across opaque origins, e.g. a sandboxed embed)
{ let want = -1, queued = false;
  const cl = (x, a, b) => Math.min(b, Math.max(a, x)), sm = t => t * t * (3 - 2 * t);
  const run = () => {
    queued = false; if (want < 0) return;
    if (!mapEl.classList.contains('ready')) { queued = true; requestAnimationFrame(run); return; }
    const p = want; want = -1;
    const s = sm(cl(p / 0.8, 0, 1)) * 0.6 + cl(p / 0.8, 0, 1) * 0.4, pt = scrub(s);
    const follow = sm(cl(p / 0.12, 0, 1)), land = sm(cl((p - 0.8) / 0.2, 0, 1));
    zoom(1 + 0.22 * follow + 1.35 * land, pt.x, pt.y);
    if (parent !== window) parent.postMessage({ rwFlightPlanStep: index }, '*');
  };
  addEventListener('message', e => { if (e.data && typeof e.data.rwFlightPlan === 'number') { want = e.data.rwFlightPlan; if (!queued) run(); } });
}

/* ---------------------------------------------------------------- frame loop */
let lastT = performance.now(), ready = false;
function frame(now) {

  if (ready) {
    const { W, H, dpr, jl } = view;
    let lift = 0;

      const p = st.dur ? clamp((now - st.t0) / st.dur, 0, 1) : 1, e = easeFlight(p), prevS = st.s;
      st.s = lerp(st.from, st.to, e); lift = Math.sin(Math.PI * p);

          if (s >= st.s * arc.L && s <= lim && now - ghost.T[b] > GHOST_MS) { ghost.T[b] = now; ghost.H[b] = head; } } }

/* ---------------------------------------------------------------- boot */
let rT = 0;
